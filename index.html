<!DOCTYPE html>
<html lang="en">
<head>
    <title>MapLibre GL JS - Branch Previewer</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, sans-serif; overflow: hidden; background: #333; height: 100vh; width: 100vw; }
        html, body { height: 100%; width: 100%; }
        
        #iframe-container {
            display: grid;
            height: 100%;
            width: 100%;
            grid-gap: 4px;
            background: #222;
        }

        .iframe-wrapper {
            position: relative;
            height: 100%;
            width: 100%;
            background: white;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .branch-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #ui-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            max-width: 250px;
            border: 1px solid #ccc;
        }

        .branch-item {
            display: block;
            margin: 8px 0;
            font-size: 14px;
            cursor: pointer;
        }

        #compare-btn {
            margin-top: 12px;
            width: 100%;
            padding: 8px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #compare-btn:hover { background: #1565c0; }

        .hidden { display: none !important; }

        /* Styles for the individual map views (inside iframe or single) */
        #map { width: 100%; height: 100%; }
        #zoom-display {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div id="ui-overlay">
    <strong>Compare Branches:</strong>
    <div id="branch-list" style="margin-top: 10px; max-height: 300px; overflow-y: auto;">
        Loading branches...
    </div>
    <button id="compare-btn">Update View</button>
</div>

<div id="iframe-container"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const isIframe = params.get('iframe') === 'true';
    const selectedBranches = params.get('branches') ? params.get('branches').split(',') : ['main'];
    
    // Hide UI if inside an iframe
    if (isIframe) {
        document.getElementById('ui-overlay').classList.add('hidden');
    }

    async function init() {
        if (isIframe) {
            setupSingleMap();
        } else {
            await setupGrid();
            setupUI();
        }
    }

    async function setupGrid() {
        const container = document.getElementById('iframe-container');
        container.innerHTML = '';

        const count = selectedBranches.length;
        const cols = count > 2 ? 2 : count;
        container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        selectedBranches.forEach(branch => {
            const wrapper = document.createElement('div');
            wrapper.className = 'iframe-wrapper';
            
            const label = document.createElement('div');
            label.className = 'branch-label';
            label.textContent = branch;

            const iframe = document.createElement('iframe');
            iframe.src = `index.html?iframe=true&branch=${branch}`;
            
            wrapper.appendChild(label);
            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
        });

        // Sync logic
        window.addEventListener('message', (e) => {
            if (e.data.type === 'mapmove') {
                document.querySelectorAll('iframe').forEach(iframe => {
                    if (iframe.contentWindow !== e.source) {
                        iframe.contentWindow.postMessage({ type: 'mapupdate', ...e.data }, '*');
                    }
                });
            }
        });
    }

    function setupSingleMap() {
        const branch = params.get('branch') || 'main';
        const basePath = `./${branch}/dist/`;

        // Create map elements
        const mapDiv = document.createElement('div');
        mapDiv.id = 'map';
        const zoomDiv = document.createElement('div');
        zoomDiv.id = 'zoom-display';
        zoomDiv.textContent = '--';
        document.body.appendChild(mapDiv);
        document.body.appendChild(zoomDiv);

        // Load assets
        const link = document.createElement('link');
        link.rel = 'stylesheet'; link.href = `${basePath}maplibre-gl.css`;
        document.head.appendChild(link);

        const script = document.createElement('script');
        script.src = `${basePath}maplibre-gl-dev.js`;
        script.onload = () => {
            const map = new maplibregl.Map({
                container: 'map',
                style: 'https://demotiles.maplibre.org/style.json',
                center: [-74.5, 40],
                zoom: 2
            });

            map.addControl(new maplibregl.NavigationControl(), 'top-right');
            
            map.on('zoom', () => zoomDiv.textContent = map.getZoom().toFixed(2));
            map.on('load', () => zoomDiv.textContent = map.getZoom().toFixed(2));

            // Synchronization
            map.on('move', () => {
                if (map._isSyncing) return;
                window.parent.postMessage({
                    type: 'mapmove',
                    center: map.getCenter(),
                    zoom: map.getZoom(),
                    bearing: map.getBearing(),
                    pitch: map.getPitch()
                }, '*');
            });

            window.addEventListener('message', (e) => {
                if (e.data.type === 'mapupdate') {
                    map._isSyncing = true;
                    map.jumpTo({
                        center: e.data.center,
                        zoom: e.data.zoom,
                        bearing: e.data.bearing,
                        pitch: e.data.pitch
                    });
                    map._isSyncing = false;
                }
            });
        };
        script.onerror = () => {
            document.body.innerHTML = `<div style="padding:20px; color:white; background:red;">
                <h3>Error loading branch "${branch}"</h3>
                <p>Assets not found at ${basePath}</p>
            </div>`;
        };
        document.head.appendChild(script);
    }

    async function setupUI() {
        const branchList = document.getElementById('branch-list');
        let branches = ['main'];
        
        try {
            const resp = await fetch('./branches.json');
            if (resp.ok) branches = await resp.json();
        } catch (e) {}

        branchList.innerHTML = '';
        branches.forEach(b => {
            const label = document.createElement('label');
            label.className = 'branch-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = b;
            cb.checked = selectedBranches.includes(b);
            label.appendChild(cb);
            label.appendChild(document.createTextNode(' ' + b));
            branchList.appendChild(label);
        });

        document.getElementById('compare-btn').onclick = () => {
            const checked = Array.from(document.querySelectorAll('#branch-list input:checked')).map(i => i.value);
            if (checked.length > 0) {
                const url = new URL(window.location.href);
                url.searchParams.set('branches', checked.join(','));
                window.location.href = url.href;
            }
        };
    }

    init();
</script>
</body>
</html>
