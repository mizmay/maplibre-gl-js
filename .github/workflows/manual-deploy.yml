name: Manual Branch Preview Deploy

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'The branch name to build and deploy'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build-dev
          [ -f src/css/maplibre-gl.css ] && mkdir -p dist && cp src/css/maplibre-gl.css dist/ || echo "No CSS to copy"

      - name: Prepare Deployment
        id: prep
        run: |
          # Sanitize branch name
          CLEAN_NAME=$(echo "${{ github.event.inputs.branch_name }}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "branch_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT
          
          mkdir -p deploy-out/${CLEAN_NAME}/dist
          cp -r dist/* deploy-out/${CLEAN_NAME}/dist/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-out
          branch: gh-pages
          clean: false
          target-folder: .

