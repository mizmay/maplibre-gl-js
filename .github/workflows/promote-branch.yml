name: Promote Branch to Registry

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'The sanitized branch name to add to the Master Loader (dropdown)'
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Update branches.json
        run: |
          [ ! -f branches.json ] && echo "[]" > branches.json
          
          BRANCH_NAME="${{ github.event.inputs.branch_name }}"
          
          node -e "
            const fs = require('fs');
            let branches = [];
            try { branches = JSON.parse(fs.readFileSync('branches.json', 'utf8')); } catch(e) {}
            if (!branches.includes('$BRANCH_NAME')) {
              branches.push('$BRANCH_NAME');
              fs.writeFileSync('branches.json', JSON.stringify(branches, null, 2));
              console.log('Promoted $BRANCH_NAME to registry.');
            } else {
              console.log('$BRANCH_NAME is already in the registry.');
            }
          "

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add branches.json
          git commit -m "Promote branch ${{ github.event.inputs.branch_name }} to production registry" || echo "No changes to commit"
          git push origin gh-pages

