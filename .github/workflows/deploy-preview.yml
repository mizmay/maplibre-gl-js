name: Deploy Branch Preview

on:
  push:
    branches:
      - preview-infra
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Optional: Commit message describing the update'
        required: false
        default: 'Update branch previews'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'mizmay/maplibre-gl-js'
    steps:
      - name: Checkout preview-infra Branch
        uses: actions/checkout@v4
        with:
          ref: preview-infra
          fetch-depth: 1

      - name: Prepare Deployment
        run: |
          # Copy everything from previews/ to deploy directory
          mkdir -p deploy-out
          cp -r previews/* deploy-out/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy-out
          branch: gh-pages
          clean: false
          target-folder: .
          commit-message: ${{ github.event.inputs.commit_message }}


